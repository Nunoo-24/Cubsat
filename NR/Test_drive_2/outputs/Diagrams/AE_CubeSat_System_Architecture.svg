<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="1760" viewBox="0 0 3400 1760"><rect x="0" y="0" width="3400" height="1760" fill="#ffffff" /><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#477A9D" /></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F8C61" /></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BD8130" /></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A24C8D" /></marker></defs><text x="30" y="62" font-size="38" font-family="Arial, sans-serif" font-weight="700" fill="#1b2b3a">AE CUBESAT ATTITUDE-CONTROL SYSTEM — 2D FUNCTIONAL / HARDWARE ARCHITECTURE</text><rect x="20" y="115" width="620" height="1520" rx="22" fill="#F0F7FF" stroke="#5B8DB8" stroke-width="4" /><path d="M42 115 H618 Q640 115 640 137 V170 H20 V137 Q20 115 42 115" fill="#5B8DB8" /><text x="38" y="152" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#ffffff">ENVIRONMENT / TEST PLANT</text><rect x="680" y="115" width="1840" height="1520" rx="22" fill="#EFFAF4" stroke="#4A9B73" stroke-width="4" /><path d="M702 115 H2498 Q2520 115 2520 137 V170 H680 V137 Q680 115 702 115" fill="#4A9B73" /><text x="698" y="152" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#ffffff">CUBESAT — ONBOARD DOMAIN</text><rect x="2560" y="115" width="820" height="1520" rx="22" fill="#FFF8EC" stroke="#C58B36" stroke-width="4" /><path d="M2582 115 H3358 Q3380 115 3380 137 V170 H2560 V137 Q2560 115 2582 115" fill="#C58B36" /><text x="2578" y="152" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#ffffff">GROUND STATION — LOCAL PC</text><path d="M330 375 L330 405" fill="none" stroke="#477A9D" stroke-width="5" marker-end="url(#arrow-blue)" /><text x="350" y="394" font-size="16" font-family="Arial, sans-serif" fill="#477A9D" font-weight="600">scene, target XYZ</text><path d="M330 660 L330 695" fill="none" stroke="#477A9D" stroke-width="5" marker-end="url(#arrow-blue)" /><text x="350" y="684" font-size="16" font-family="Arial, sans-serif" fill="#477A9D" font-weight="600">plant state</text><path d="M330 975 L330 1005" fill="none" stroke="#477A9D" stroke-width="5" marker-end="url(#arrow-blue)" /><text x="350" y="995" font-size="16" font-family="Arial, sans-serif" fill="#477A9D" font-weight="600">synthetic observations</text><path d="M615 280 L650 280 L650 325 L710 325" fill="none" stroke="#2F8C61" stroke-width="5" marker-end="url(#arrow-green)" /><text x="650" y="265" font-size="16" font-family="Arial, sans-serif" fill="#2F8C61" font-weight="600">physical scene → image</text><path d="M615 1110 L665 1110 L665 365 L710 365" fill="none" stroke="#2F8C61" stroke-width="5" marker-end="url(#arrow-green)" stroke-dasharray="12 9" /><text x="672" y="1090" font-size="16" font-family="Arial, sans-serif" fill="#2F8C61" font-weight="600">sim frame / RLE1</text><path d="M615 845 L665 845 L665 580 L1570 580 L1570 500" fill="none" stroke="#2F8C61" stroke-width="5" marker-end="url(#arrow-green)" stroke-dasharray="12 9" /><text x="1040" y="575" font-size="16" font-family="Arial, sans-serif" fill="#2F8C61" font-weight="600">synthetic XYZ samples</text><path d="M1135 570 L1135 620" fill="none" stroke="#2F8C61" stroke-width="5" marker-end="url(#arrow-green)" /><text x="1155" y="610" font-size="16" font-family="Arial, sans-serif" fill="#2F8C61" font-weight="600">image X/Y error</text><path d="M2030 570 L2030 610 L2030 610" fill="none" stroke="#2F8C61" stroke-width="5" marker-end="url(#arrow-green)" /><text x="2050" y="600" font-size="16" font-family="Arial, sans-serif" fill="#2F8C61" font-weight="600">rates / gravity / field</text><path d="M1140 1035 L1140 1080" fill="none" stroke="#BD8130" stroke-width="5" marker-end="url(#arrow-amber)" /><text x="1155" y="1070" font-size="16" font-family="Arial, sans-serif" fill="#BD8130" font-weight="600">bounded motor command</text><path d="M1570 820 L1580 820 L1580 1260" fill="none" stroke="#477A9D" stroke-width="5" marker-end="url(#arrow-blue)" /><text x="1590" y="1010" font-size="16" font-family="Arial, sans-serif" fill="#477A9D" font-weight="600">telemetry data</text><path d="M710 1280 L660 1280 L660 530 L610 530" fill="none" stroke="#BD8130" stroke-width="5" marker-end="url(#arrow-amber)" /><text x="630" y="910" font-size="16" font-family="Arial, sans-serif" fill="#BD8130" font-weight="600">reaction torque</text><path d="M980 1035 L980 1320 L610 1320" fill="none" stroke="#2F8C61" stroke-width="5" marker-end="url(#arrow-green)" stroke-dasharray="12 9" /><text x="870" y="1300" font-size="16" font-family="Arial, sans-serif" fill="#2F8C61" font-weight="600">virtual axes: simulator only</text><path d="M2480 1200 L2550 1200 L2550 300 L2585 300" fill="none" stroke="#BD8130" stroke-width="5" marker-end="url(#arrow-amber)" /><text x="2530" y="1180" font-size="16" font-family="Arial, sans-serif" fill="#BD8130" font-weight="600">Wi-Fi telemetry</text><path d="M2970 430 L2970 460" fill="none" stroke="#BD8130" stroke-width="5" marker-end="url(#arrow-amber)" /><text x="2990" y="450" font-size="16" font-family="Arial, sans-serif" fill="#BD8130" font-weight="600">packets</text><path d="M2970 720 L2970 750" fill="none" stroke="#BD8130" stroke-width="5" marker-end="url(#arrow-amber)" /><text x="2990" y="740" font-size="16" font-family="Arial, sans-serif" fill="#BD8130" font-weight="600">decoded data</text><path d="M2970 1085 L2970 1115" fill="none" stroke="#BD8130" stroke-width="5" marker-end="url(#arrow-amber)" /><text x="2990" y="1105" font-size="16" font-family="Arial, sans-serif" fill="#BD8130" font-weight="600">UI / test commands</text><path d="M3350 1280 L3380 1280 L3380 300 L3355 300" fill="none" stroke="#A24C8D" stroke-width="5" marker-end="url(#arrow-purple)" stroke-dasharray="12 9" /><text x="3340" y="1280" font-size="16" font-family="Arial, sans-serif" fill="#A24C8D" font-weight="600">bounded commands</text><path d="M2590 300 L2545 300 L2545 800 L2480 800" fill="none" stroke="#A24C8D" stroke-width="5" marker-end="url(#arrow-purple)" stroke-dasharray="12 9" /><text x="2520" y="585" font-size="16" font-family="Arial, sans-serif" fill="#A24C8D" font-weight="600">supervisory only</text><path d="M610 1450 L655 1450 L655 600 L610 600" fill="none" stroke="#2F8C61" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arrow-green)" /><text x="635" y="1418" font-size="16" font-family="Arial, sans-serif" fill="#2F8C61" font-weight="600">simulated pitch/roll torque</text><rect x="45" y="180" width="570" height="195" rx="14" fill="#FFFFFF" stroke="#5B8DB8" stroke-width="3" /><text x="63" y="211" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">Scene / physical target</text><text x="63" y="241" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="63" dy="0">Black point on poster; target pose and scale</tspan><tspan x="63" dy="23">Physical rig: gimbal motion, lighting, occlusion</tspan><tspan x="63" dy="23">Simulation UI: target XYZ/size, torque pulses, cover camera</tspan></text><rect x="45" y="410" width="570" height="250" rx="14" fill="#FFFFFF" stroke="#5B8DB8" stroke-width="3" /><text x="63" y="441" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">Environment dynamics</text><text x="63" y="471" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="63" dy="0">Sim_Environment Python plant: yaw wheel +</tspan><tspan x="63" dy="23">simplified pendular pitch/roll; synthetic body state</tspan><tspan x="63" dy="23">Disturbance torque XYZ × duration; reaction torque</tspan><tspan x="63" dy="23">updates attitude and camera/sensor viewpoints</tspan></text><rect x="45" y="700" width="570" height="270" rx="14" fill="#FFFFFF" stroke="#5B8DB8" stroke-width="3" /><text x="63" y="731" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">Synthetic observation generation</text><text x="63" y="761" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="63" dy="0">QVGA grayscale camera render (320×240)</tspan><tspan x="63" dy="23">Synthetic gyro XYZ, accelerometer XYZ, fixed-field</tspan><tspan x="63" dy="23">magnetometer; freshness, target visibility and</tspan><tspan x="63" dy="23">camera occlusion modeled</tspan><tspan x="63" dy="23">All values/calibration are provisional</tspan></text><rect x="45" y="1010" width="570" height="285" rx="14" fill="#E8F2FC" stroke="#5B8DB8" stroke-width="3" /><text x="63" y="1041" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">Simulator bridge / test interface</text><text x="63" y="1071" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="63" dy="0">Versioned local HTTP/JSON endpoints</tspan><tspan x="63" dy="23">Camera frame paired by sequence; bounded lossless</tspan><tspan x="63" dy="23">RLE1 transport to host SIL / Wokwi profile</tspan><tspan x="63" dy="23">Ground Station may control the simulated scene</tspan><tspan x="63" dy="23">This is not the selected physical radio protocol</tspan></text><rect x="45" y="1330" width="570" height="255" rx="14" fill="#E8F2FC" stroke="#5B8DB8" stroke-width="3" stroke-dasharray="10 7" /><text x="63" y="1361" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">Simulation-only control path</text><text x="63" y="1391" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="63" dy="0">Host SIL closes the loop against the plant</tspan><tspan x="63" dy="23">Virtual pitch/roll torques are accepted only from</tspan><tspan x="63" dy="23">simulated observations; they are not physical</tspan><tspan x="63" dy="23">actuators. Keep this path visually distinct.</tspan></text><rect x="715" y="180" width="840" height="390" rx="14" fill="#FFFFFF" stroke="#4A9B73" stroke-width="3" /><text x="733" y="211" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">CAMERA SYSTEM — XIAO ESP32-S3 SENSE</text><text x="733" y="241" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="733" dy="0">Hardware: OV5640 camera (confirm kit revision; some board</tspan><tspan x="733" dy="23">variants may differ); autofocus path; QVGA grayscale frame</tspan><tspan x="733" dy="23">Process: threshold dark pixels → binary mask → 8-neighbour</tspan><tspan x="733" dy="23">coherence filter → centroid → offset from optical centre</tspan><tspan x="733" dy="23">Output: image X/Y error for pointing; preview + error for GS</tspan><tspan x="733" dy="23">Optional asymmetric marker estimates roll; point target alone</tspan><tspan x="733" dy="23">has no camera roll cue. Pixel-to-angle needs calibration.</tspan></text><rect x="1580" y="180" width="900" height="390" rx="14" fill="#FFFFFF" stroke="#4A9B73" stroke-width="3" /><text x="1598" y="211" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">SENSOR SYSTEM — SHARED I²C INPUTS</text><text x="1598" y="241" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="1598" dy="0">MPU-6050: 3-axis gyro + accelerometer; breakout voltage /</tspan><tspan x="1598" dy="23">logic levels must be checked before wiring ("5.5 V" is not</tspan><tspan x="1598" dy="23">a safe bare-chip rating). Startup bias, scaling, timestamps.</tspan><tspan x="1598" dy="23">LIS3MDL: XYZ magnetic field; selectable ±4/8/12/16 G.</tspan><tspan x="1598" dy="23">Firmware uses I²C; mounting/axis map and magnetic calibration</tspan><tspan x="1598" dy="23">are open. Physical magnetic correction is disabled pending</tspan><tspan x="1598" dy="23">calibration and motor-interference checks.</tspan></text><rect x="715" y="625" width="1765" height="405" rx="14" fill="#FFFFFF" stroke="#4A9B73" stroke-width="3" /><text x="733" y="656" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">ONBOARD PROCESSING — SEEED XIAO ESP32-S3 SENSE</text><text x="733" y="686" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="733" dy="0">Camera + sensor observations enter the onboard 50 Hz reference loop.</tspan><tspan x="733" dy="23">Estimate: yaw-only gyro integration; SIL can use a known synthetic magnetic reference;</tspan><tspan x="733" dy="23">physical firmware is relative gyro yaw until mounting and magnetic calibration are known.</tspan><tspan x="733" dy="23">Visual pointing uses target image error + body-Y gyro rate; target loss falls back to rate damping.</tspan><tspan x="733" dy="23">Bounded control orders, age/validity checks, operating modes and watchdog protections.</tspan><tspan x="733" dy="23">Simulation source adds virtual pitch (image Y) / roll (optional marker) torques; physical</tspan><tspan x="733" dy="23">motor path is yaw-only. Controller gains, limits and plant constants remain uncalibrated.</tspan></text><rect x="715" y="1085" width="850" height="445" rx="14" fill="#FFFDF7" stroke="#C58B36" stroke-width="3" stroke-dasharray="10 7" /><text x="733" y="1116" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">ACTUATION SYSTEM — PHYSICAL PATH</text><text x="733" y="1146" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="733" dy="0">Seeed XIAO → bounded motor command → moteus r4.11</tspan><tspan x="733" dy="23">motor controller → 5208 Kv330 BLDC + reaction wheel</tspan><tspan x="733" dy="23">Wheel momentum change gives opposite body torque.</tspan><tspan x="733" dy="23">Interface candidate: TTL UART on moteus AUX2; ESP32-S3</tspan><tspan x="733" dy="23">TWAI is Classical CAN and cannot directly send CAN-FD.</tspan><tspan x="733" dy="23">UART wiring, drive config, motor power, watchdog and</tspan><tspan x="733" dy="23">safe stop are not built / hardware-verified.</tspan><tspan x="733" dy="23">Only yaw is physically actuated in current scope.</tspan></text><rect x="1590" y="1085" width="890" height="445" rx="14" fill="#FFFFFF" stroke="#4A9B73" stroke-width="3" /><text x="1608" y="1116" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">TELEMETRY / TELECOMMAND — ONBOARD</text><text x="1608" y="1146" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="1608" dy="0">Telemetry inputs: camera error + preview metadata, gyro /</tspan><tspan x="1608" dy="23">accel / mag XYZ, yaw estimate, mode/fault, controller and</tspan><tspan x="1608" dy="23">actuator housekeeping, timestamps and freshness.</tspan><tspan x="1608" dy="23">XIAO Wi-Fi packet/link layer → Ground Station.</tspan><tspan x="1608" dy="23">Simulation: local HTTP/JSON + sequence-paired RLE1 frame.</tspan><tspan x="1608" dy="23">Physical Wi-Fi/radio protocol, packet framing, security and</tspan><tspan x="1608" dy="23">replay rules are not selected.</tspan><tspan x="1608" dy="23">Ground commands are supervisory only, not the control loop.</tspan></text><rect x="2590" y="180" width="760" height="245" rx="14" fill="#FFFFFF" stroke="#C58B36" stroke-width="3" /><text x="2608" y="211" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">WI-FI / DATA LINK BOUNDARY</text><text x="2608" y="241" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="2608" dy="0">Current simulator: local HTTP/JSON bridge</tspan><tspan x="2608" dy="23">Physical link and TM/TC protocol: TBD</tspan><tspan x="2608" dy="23">Telemetry flows to PC; bounded commands return</tspan></text><rect x="2590" y="465" width="760" height="250" rx="14" fill="#FFFFFF" stroke="#C58B36" stroke-width="3" /><text x="2608" y="496" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">GROUND-STATION RECEIVE / DECODE</text><text x="2608" y="526" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="2608" dy="0">Validate and decode telemetry; pair frame metadata</tspan><tspan x="2608" dy="23">with the matching preview; display sample age / link state</tspan><tspan x="2608" dy="23">Keep invalid or stale samples out of trend lines</tspan></text><rect x="2590" y="755" width="760" height="325" rx="14" fill="#FFFFFF" stroke="#C58B36" stroke-width="3" /><text x="2608" y="786" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">OPERATOR UI</text><text x="2608" y="816" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="2608" dy="0">Time history: target direction / pointing error</tspan><tspan x="2608" dy="23">Camera image with target centroid and error overlay</tspan><tspan x="2608" dy="23">Housekeeping, mode, yaw estimate, sensor freshness,</tspan><tspan x="2608" dy="23">actuator status and faults</tspan><tspan x="2608" dy="23">Display simulator truth separately from CubeSat telemetry</tspan></text><rect x="2590" y="1120" width="760" height="350" rx="14" fill="#FFFFFF" stroke="#C58B36" stroke-width="3" /><text x="2608" y="1151" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">LOGGING + SUPERVISORY COMMANDS</text><text x="2608" y="1181" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="2608" dy="0">CSV telemetry logging on local PC</tspan><tspan x="2608" dy="23">Bounded commands: PING, enumerated modes, relative</tspan><tspan x="2608" dy="23">yaw step, timed wheel-speed commissioning</tspan><tspan x="2608" dy="23">Acknowledgement/status returned in telemetry</tspan><tspan x="2608" dy="23">No PC-side target error computation closes the loop</tspan></text><rect x="2590" y="1510" width="760" height="90" rx="14" fill="#FFF0D8" stroke="#C58B36" stroke-width="3" /><text x="2608" y="1541" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#203648">EVIDENCE / LIMITS</text><text x="2608" y="1571" font-size="16" font-family="Arial, sans-serif" fill="#2c3e50"><tspan x="2608" dy="0">Host SIL verified; firmware, Wokwi, live network and hardware remain open</tspan></text><text x="700" y="1680" font-size="17" font-family="Arial, sans-serif" fill="#263746">Solid green: observation flow  |  Amber: physical actuator/interface candidate  |  Dashed green: simulation-only virtual axes  |  Dashed purple: bounded supervisory commands  |  Dashed amber module: pending hardware decision/verification</text></svg>